name: Release

on:
  workflow_dispatch:

concurrency: release

env:
  AZURE_WEBAPP_NAME: ned-wot
  DOTNET_VERSION: 11.0.100

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    env:
      PACKAGES: NED.WoT.BattleResults.Client/AppPackages
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MAUI workload
      run: dotnet workload install maui-windows --version 11.0.100.1

    - name: Decrypt PFX File
      run: |
        echo "${{ secrets.WINDOWS_PFX_FILE}}" > cert.pfx.asc
        certutil -decode cert.pfx.asc cert.pfx

    - name: Add Cert to Store
      run: certutil -user -p ${{ secrets.WINDOWS_PFX_PASSWORD }} -Silent -importpfx cert.pfx NoRoot

    - name: Build
      run: dotnet publish NED.WoT.BattleResults.Client\NED.WoT.BattleResults.Client.csproj -c Release -f:net11.0-windows10.0.19041.0 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint=${{ secrets.WINDOWS_PFX_THUMBPRINT }}

    - name: Update .appinstaller file
      run: |
        sed -i 's|http://schemas.microsoft.com/appx/appinstaller/2017/2|http://schemas.microsoft.com/appx/appinstaller/2021|' '${{ env.PACKAGES }}/NED.WoT.BattleResults.Client_x64.appinstaller'
        sed -i 's|HoursBetweenUpdateChecks="0"|HoursBetweenUpdateChecks="0" ShowPrompt="true"|' '${{ env.PACKAGES }}/NED.WoT.BattleResults.Client_x64.appinstaller'

    - name: Deploy to Azure webapp
      uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{ env.PACKAGES }}'
