
name: .NET Core Desktop - Build and Deploy

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ned-wot
  AZURE_WEBAPP_PACKAGE_PATH: battleresults-app
  DOTNET_VERSION: 10.0.x
  APP_PACKAGES_LOCATION: NED.WoT.BattleResults.Client\bin\Release\net10.0-windows10.0.19041.0\win10-x64\AppPackages

jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Version is higher than master
      shell: pwsh
      run: |
        $path = 'NED.WoT.BattleResults.Client/Platforms/Windows/Package.appxmanifest'
        $pattern = '<Identity[^>]*\sVersion="([^"]+)"'
        function Read-Version($text, $where) {
          $m = [regex]::Match($text, $pattern)
          $v = $null
          if (-not $m.Success -or -not [version]::TryParse($m.Groups[1].Value, [ref]$v)) {
            Write-Host "::error::Could not read Identity Version from $path at $where."
            exit 1
          }
          $v
        }
        $head = Read-Version (Get-Content $path -Raw) 'head'
        $base = Read-Version (git show "origin/master:$path" | Out-String) 'master'
        if ($head -le $base) {
          Write-Host "::error::Package.appxmanifest Identity Version is $head, master has $base. Raise it (CLAUDE.md, Branches, commits, PRs)."
          exit 1
        }
        Write-Host "Version $base -> $head"

  build:  
    runs-on: windows-latest      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
                  
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }} 
    
    - name: Install MAUI workload
      run: dotnet workload install maui
      
    - name: Decrypt PFX File
      run: |
        echo "${{ secrets.WINDOWS_PFX_FILE}}" > cert.pfx.asc
        certutil -decode cert.pfx.asc cert.pfx
    
    - name: Add Cert to Store
      run: certutil -user -p ${{ secrets.WINDOWS_PFX_PASSWORD }} -Silent -importpfx cert.pfx NoRoot

    - name: Build
      run:  dotnet publish NED.WoT.BattleResults.Client\NED.WoT.BattleResults.Client.csproj -c Release -f:net10.0-windows10.0.19041.0 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint=${{ secrets.WINDOWS_PFX_THUMBPRINT }}

    - name: Update .appinstaller file
      run: |        
        sed -i 's|http://schemas.microsoft.com/appx/appinstaller/2017/2|http://schemas.microsoft.com/appx/appinstaller/2021|' 'NED.WoT.BattleResults.Client/bin/Release/net10.0-windows10.0.19041.0/win10-x64/AppPackages/NED.WoT.BattleResults.Client_x64.appinstaller'
        sed -i 's|HoursBetweenUpdateChecks="0"|HoursBetweenUpdateChecks="0" ShowPrompt="true"|' 'NED.WoT.BattleResults.Client/bin/Release/net10.0-windows10.0.19041.0/win10-x64/AppPackages/NED.WoT.BattleResults.Client_x64.appinstaller'


    - name: Deploy to Azure webapp
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
      uses: azure/webapps-deploy@v2
      with: 
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'NED.WoT.BattleResults.Client/bin/Release/net10.0-windows10.0.19041.0/win10-x64/AppPackages'
