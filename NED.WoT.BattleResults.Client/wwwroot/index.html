<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WoT Gevechtslog</title>
    <link rel="icon" type="image/svg+xml" href="img/gevechtslog-mark.svg" />
    <base href="/" />
    <link href="css/layers.css" rel="stylesheet" />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/mud.css" rel="stylesheet" />
    <link href="css/wot.css" rel="stylesheet" />
    <link href="css/gl.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="NED.WoT.BattleResults.Client.styles.css" rel="stylesheet" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="splash">
            <span class="splash-corner tl"></span><span class="splash-corner tr"></span><span class="splash-corner bl"></span><span class="splash-corner br"></span>
            <div class="splash-body">
                <div class="splash-sight"><span class="splash-h l"></span><span class="splash-h r"></span><img src="img/gevechtslog-hero.svg" alt="" /></div>
                <p class="splash-wordmark">WoT <b>Gevechtslog</b></p>
                <div class="splash-prog" role="progressbar" aria-label="Laden"><i></i></div>
                <p class="splash-caption">Gevechten laden…</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        function scrollIntoView(elementId) {
            console.log('scrollIntoView', elementId);
            var elem = document.getElementById(elementId);
            if (elem) {
                setTimeout(() => elem.scrollIntoView({ behavior: 'smooth'}), 50);
            }
        }

        function openOwnTeam(selector) {
            console.log('openOwnTeam', selector);
            var elements = document.querySelectorAll(selector);
            if (elements.length === 1) {
                elements[0].click();
            }
        }
    </script>
</body>

</html>
