<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WoT Gevechtslog</title>
    <link rel="icon" type="image/svg+xml" href="img/gevechtslog-mark.svg" />
    <base href="/" />
    <link href="css/layers.css" rel="stylesheet" />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/mud.css" rel="stylesheet" />
    <link href="css/wot.css" rel="stylesheet" />
    <link href="css/gl.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="NED.WoT.BattleResults.Client.styles.css" rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div class="splash">
            <span class="splash-corner tl"></span><span class="splash-corner tr"></span><span class="splash-corner bl"></span><span class="splash-corner br"></span>
            <div class="splash-body">
                <div class="splash-sight"><span class="splash-h l"></span><span class="splash-h r"></span><img src="img/gevechtslog-tank.svg" alt="" /><img class="splash-reticle" src="img/gevechtslog-reticle.svg" alt="" /></div>
                <p class="splash-wordmark">WoT <b>Gevechtslog</b></p>
                <div class="splash-prog" role="progressbar" aria-label="Laden"><i></i></div>
                <p class="splash-caption">Gevechten laden…</p>
            </div>
            <p class="splash-byline">Een initiatief van <b>NED-1</b></p>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <div class="error-bar">
            <svg class="error-bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"></path></svg>
            <span class="error-bar-text">Er is een onverwachte fout opgetreden.</span>
            <a href="" class="reload">Herladen</a>
            <button type="button" class="dismiss" aria-label="Sluiten" title="Sluiten" onclick="document.getElementById('blazor-error-ui').style.display = 'none'">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
            </button>
        </div>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        // The copy cell of a battle row has its own right-click menu (BattleRow); the browser's one never shows there.
        document.addEventListener('contextmenu', e => { if (e.target.closest('.wot-battle-table td.p4')) e.preventDefault(); });

        function scrollIntoView(elementId) {
            console.log('scrollIntoView', elementId);
            var elem = document.getElementById(elementId);
            if (elem) {
                setTimeout(() => elem.scrollIntoView({ behavior: 'smooth'}), 50);
            }
        }

        // The day of the first visible row of the battle table, for the sticky day row in its thead: the last row (a battle or a day header) that starts above the sticky headers. Index calls this after every render; it only rewires when the table is another element.
        var currentDayWatch = null;
        function watchCurrentDay(ref, selector) {
            var c = document.querySelector(selector);
            if (currentDayWatch && currentDayWatch.c === c) { currentDayWatch.compute(); return; }
            unwatchCurrentDay();
            var tbody = c && c.querySelector('tbody');
            if (!tbody) return;
            var last = null, queued = false;
            function compute() {
                queued = false;
                var stack = 0, day = null;
                c.querySelectorAll(':scope > .mud-table-root > thead > tr > .mud-table-cell').forEach(function (h) { stack = Math.max(stack, h.getBoundingClientRect().bottom); });
                var rows = tbody.querySelectorAll(':scope > tr.gl-row, :scope > tr.gl-day');
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].getBoundingClientRect().top > stack + 0.5) break;
                    day = rows[i].firstElementChild.dataset.day;
                }
                if (day && day !== last) { last = day; ref.invokeMethodAsync('SetCurrentDay', day); }
            }
            function onScroll() { if (!queued) { queued = true; requestAnimationFrame(compute); } }
            c.addEventListener('scroll', onScroll, { passive: true });
            var mo = new MutationObserver(onScroll); mo.observe(tbody, { childList: true });
            currentDayWatch = { c: c, onScroll: onScroll, compute: compute, mo: mo };
            onScroll();
        }
        function unwatchCurrentDay() {
            if (currentDayWatch) { currentDayWatch.c.removeEventListener('scroll', currentDayWatch.onScroll); currentDayWatch.mo.disconnect(); }
            currentDayWatch = null;
        }

        function openOwnTeam(selector) {
            console.log('openOwnTeam', selector);
            var elements = document.querySelectorAll(selector);
            if (elements.length === 1) {
                elements[0].click();
            }
        }
    </script>
</body>

</html>
